<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>Workflow flowchart for the air quality prediction system</title>
<desc>Five sequential steps: sensor and API input, data ingestion, ML forecasting, anomaly check, then dashboard and app output.</desc>
<rect width="680" height="520" fill="#F7F9FA"/>
<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6C7A82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g>
  <rect x="190" y="20" width="300" height="56" rx="8" fill="#EEF6FB" stroke="#5FA8D3" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#16222B">Input</text>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#3C4B54">Sensor readings, weather, traffic data</text>
</g>
<line x1="340" y1="76" x2="340" y2="120" stroke="#6C7A82" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
  <rect x="190" y="120" width="300" height="56" rx="8" fill="#E8F0F7" stroke="#2E6E9E" stroke-width="1"/>
  <text x="340" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#16222B">Processing: ingestion</text>
  <text x="340" y="160" text-anchor="middle" font-size="12" fill="#3C4B54">Validate and store as time-series</text>
</g>
<line x1="340" y1="176" x2="340" y2="220" stroke="#6C7A82" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
  <rect x="190" y="220" width="300" height="56" rx="8" fill="#E8F0F7" stroke="#2E6E9E" stroke-width="1"/>
  <text x="340" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#16222B">Processing: ML forecast</text>
  <text x="340" y="260" text-anchor="middle" font-size="12" fill="#3C4B54">Predict AQI per zone, 6-24hr ahead</text>
</g>
<line x1="340" y1="276" x2="340" y2="320" stroke="#6C7A82" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
  <rect x="190" y="320" width="300" height="56" rx="8" fill="#E8F0F7" stroke="#2E6E9E" stroke-width="1"/>
  <text x="340" y="342" text-anchor="middle" font-size="14" font-weight="600" fill="#16222B">Processing: anomaly check</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="#3C4B54">Flags sudden pollution spikes</text>
</g>
<line x1="340" y1="376" x2="340" y2="420" stroke="#6C7A82" stroke-width="1.5" marker-end="url(#arrow2)"/>

<g>
  <rect x="190" y="420" width="300" height="56" rx="8" fill="#F1ECF7" stroke="#8B6FB0" stroke-width="1"/>
  <text x="340" y="442" text-anchor="middle" font-size="14" font-weight="600" fill="#16222B">Output</text>
  <text x="340" y="460" text-anchor="middle" font-size="12" fill="#3C4B54">Dashboard heatmap, app alerts</text>
</g>
</svg>
